# What every instance of this service deploys with. An instance's `deploy`
# lays over this key by key, exactly as `values` lays over the service's own
# defaults.yaml — the image tag is the clear case for writing one here and
# overriding it on a machine that has not been updated yet.
image: danielszabo99/microbin:2.0.4
restart: unless-stopped

# Where the install script puts this instance's files, and what it starts
# them with. Both are the machine's business rather than anything dgs
# derives, so they are ordinary deploy values: an instance on a host that
# keeps its services elsewhere, or that runs podman, overrides them.
dir: /srv
compose: docker compose
