# Changed: both instances in containers on one network.
id: home
containers:
  - {name: apps, subnet: 172.29.0.0/24}
instances:
  - id: agent-home
    service: reverse-agent
    runtime: docker
  - id: ss-home
    service: ssserver
    runtime: docker
    bind: "0.0.0.0"
    ports:
      users: 8388
host: home
