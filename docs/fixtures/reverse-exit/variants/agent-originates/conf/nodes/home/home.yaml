id: home
networks:
  home: 10.0.0.20
instances:
  # Changed: the agent also listens, as a local SOCKS entry for this machine,
  # so traffic would start at the from end of home-nce.
  - id: agent-home
    service: reverse-agent
    bind: 127.0.0.1
    ports:
      socks: 1080
  - id: ss-home
    service: ssserver
    bind: 127.0.0.1
    ports:
      users: 8388
