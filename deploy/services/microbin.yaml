# MicroBin, a pastebin. It reads its whole configuration from the
# environment, which the export renders into server.env.
binary:
  name: microbin
  version: 2.1.0
  url: https://github.com/szabodanika/microbin/releases/download/v{version}/microbin-v{version}-{target}.tar.gz
  targets:
    darwin/arm64: aarch64-apple-darwin
    darwin/amd64: x86_64-apple-darwin
    linux/arm64: aarch64-unknown-linux-musl
    linux/amd64: x86_64-unknown-linux-musl
command: ["{bin}/microbin"]
env_files: [server.env]
